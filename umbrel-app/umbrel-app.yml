manifestVersion: 1.1
id: umbrel-dropbox-client
name: Dropbox
tagline: Safe, scoped Dropbox sync for Umbrel with dry-run defaults
icon: https://raw.githubusercontent.com/earlvanze/umbrel-dropbox-client/master/data/icons/icon.svg
category: files
version: "1.2.3"
description: >-
  A Linux-first Dropbox sync daemon for Umbrel. Keeps your Dropbox files in sync
  with a local folder, with a built-in web dashboard for status, conflicts, and
  health checks. Features a rich single-page dashboard with file manager
  (upload, download, delete, create folders), settings configuration, sync
  controls, conflict resolution, and an interactive setup wizard. Ships with
  dry-run mode enabled by default so you can preview every action before any
  file is touched. Live transfers require explicit opt-in via environment
  variables, making it safe to install from the app store. NOTE: Dropbox is a trademark of Dropbox, Inc.; this app is an independent community project and is not affiliated with Dropbox, Inc.
developer: Earl Co
website: https://github.com/earlvanze/umbrel-dropbox-client
repo: https://github.com/earlvanze/umbrel-dropbox-client
support: https://github.com/earlvanze/umbrel-dropbox-client/issues
port: 8477
gallery:
  - 1.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Trademark notice: Dropbox is a trademark of Dropbox, Inc. This app is not
  affiliated with, endorsed by, or sponsored by Dropbox, Inc. Use of the
  Dropbox name is for identification and interoperability purposes only.
  v1.2.3 renames the app to "Dropbox" (without "Client") to make clear that
  this is a third-party Umbrel community project, not an official Dropbox
  product, and swaps the icon for a neutral folder glyph that does not use
  the Dropbox brand. It also adds a /dashboard route alias to fix the 404
  in the Umbrel UI, updates the page title and the dashboard brand text,
  and carries forward the v1.2.2 conflict routes fix.
dependencies: []
submitter: Earl Co
submission: https://github.com/earlvanze/umbrel-dropbox-client

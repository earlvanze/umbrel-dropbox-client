version: 2
project_name: umbrel-dropbox-client
builds:
  - id: cli
    main: ./cmd/umbrel-dropbox-client
    binary: umbrel-dropbox-client
    goos: [linux]
    goarch: [amd64, arm64]
  - id: daemon
    main: ./cmd/umbrel-dropbox-clientd
    binary: umbrel-dropbox-clientd
    goos: [linux]
    goarch: [amd64, arm64]
nfpms:
  - id: deb
    package_name: umbrel-dropbox-client
    formats: [deb]
    maintainer: Earl Co <earl@aops.studio>
    description: Reliable Dropbox sync daemon for Linux and Umbrel.
    license: MIT
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/umbrel-dropbox-client.service
        dst: /usr/lib/systemd/user/umbrel-dropbox-client.service
      - src: desktop/dolphin/umbrel-dropbox-client.desktop
        dst: /usr/share/kio/servicemenus/umbrel-dropbox-client.desktop
    scripts:
      postinstall: packaging/deb/postinst
archives:
  - formats: [tar.gz]
checksum:
  name_template: checksums.txt
release:
  github:
    owner: earlvanze
    name: umbrel-dropbox-client
